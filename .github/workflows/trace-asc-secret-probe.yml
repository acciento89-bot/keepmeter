name: Trace ASC Secret Probe

on:
  push:
    branches:
      - agent/trace-testflight-relay
    paths:
      - '.github/workflows/trace-asc-secret-probe.yml'

permissions:
  contents: read

concurrency:
  group: trace-asc-secret-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check App Store Connect secret presence only
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY_B64; do
            if [[ -z "${!name}" ]]; then
              echo "${name}=missing"
              missing=1
            else
              echo "${name}=present"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'KeepMeter cannot currently relay Trace TestFlight: one or more ASC secrets are missing.'
            exit 1
          fi
          echo 'All required ASC secrets are present; values were not exposed.'
