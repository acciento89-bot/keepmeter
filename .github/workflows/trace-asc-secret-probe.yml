name: Trace ASC Secret Probe

on:
  push:
    branches:
      - agent/trace-testflight-relay
    paths:
      - '.github/workflows/trace-asc-secret-probe.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: trace-asc-secret-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check App Store Connect secret presence only
        id: probe
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY_B64; do
            if [[ -z "${!name}" ]]; then
              echo "${name}=missing"
              missing=1
            else
              echo "${name}=present"
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'All required ASC secrets are present; values were not exposed.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'One or more ASC secrets are missing.'
          fi

      - name: Publish credential probe status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AVAILABLE: ${{ steps.probe.outputs.available }}
        run: |
          set -euo pipefail
          if [[ "$AVAILABLE" == 'true' ]]; then
            STATE='success'
            DESCRIPTION='ASC relay credentials available'
          else
            STATE='error'
            DESCRIPTION='ASC relay credentials missing'
          fi
          PAYLOAD=$(jq -n --arg state "$STATE" --arg description "$DESCRIPTION" --arg context 'trace-relay/asc-secrets' '{state:$state,description:$description,context:$context}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD" >/dev/null

      - name: Fail when relay credentials are unavailable
        if: steps.probe.outputs.available != 'true'
        run: exit 1
