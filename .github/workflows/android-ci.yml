name: Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
      - fix/android-ios-parity-20260913
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'KeepMeter/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'KeepMeter/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK and icon renderer
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify launcher and Play icon source parity
        shell: bash
        run: |
          set -euo pipefail
          IOS_ICON='KeepMeter/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          ANDROID_ICON='android/app/src/main/res/drawable-nodpi/ic_launcher.png'
          test -s "$IOS_ICON"
          test -s "$ANDROID_ICON"
          cmp -s "$IOS_ICON" "$ANDROID_ICON"
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug App Bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build unsigned release App Bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify release identity, system-bar parity and launcher icon
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "de.kamilunavo.keepmeter"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 5' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.4"' android/app/build.gradle.kts
          grep -Fq 'enableEdgeToEdge' android/app/src/main/java/de/kamilunavo/keepmeter/MainActivity.kt
          grep -Fq 'SystemBarStyle.dark' android/app/src/main/java/de/kamilunavo/keepmeter/MainActivity.kt
          grep -Fq 'SystemBarStyle.light' android/app/src/main/java/de/kamilunavo/keepmeter/MainActivity.kt
          grep -Fq 'WindowInsets.safeDrawing' android/app/src/main/java/de/kamilunavo/keepmeter/KeepMeterUi.kt
          grep -Fq 'android:icon="@drawable/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          test -z "$(find android/app/src/main/res -type f \( -path '*/mipmap-anydpi*' -o -iname '*adaptive*' -o -iname '*foreground*' -o -iname '*background*' \) -print -quit)"
          ! grep -Fq 'generateLauncherIcon' android/app/build.gradle.kts
      - name: Render canonical Play icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/play-assets
          convert KeepMeter/Assets.xcassets/AppIcon.appiconset/AppIcon.png -resize 512x512 android/play-assets/icon-512.png
          file android/play-assets/icon-512.png
          test "$(stat -c%s android/play-assets/icon-512.png)" -lt 1048576
          sha256sum android/play-assets/icon-512.png > android/play-assets/icon-512.png.sha256
      - name: Upload Android review assets
        uses: actions/upload-artifact@v4
        with:
          name: KeepMeter-1.0.4-5-android-review
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/play-assets/icon-512.png
            android/play-assets/icon-512.png.sha256
            store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30
