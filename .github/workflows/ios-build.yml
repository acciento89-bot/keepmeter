name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: keepmeter-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate StoreKit test configuration
        run: |
          set -euo pipefail
          python3 -m json.tool KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '"productID" : "de.kamilunavo.keepmeter.pro.lifetime"' KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '../../../KeepMeter/StoreKit/KeepMeter.storekit' KeepMeter.xcodeproj/xcshareddata/xcschemes/KeepMeter.xcscheme >/dev/null

      - name: Validate App Store release settings
        run: bash ci/release-preflight.sh

      - name: Validate EN/DE localization integrity
        run: python3 ci/localization-preflight.py

      - name: Exercise product decision rules
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            KeepMeter/Models/Purchase.swift \
            KeepMeter/Models/UsageEvent.swift \
            KeepMeter/Services/DecisionEngine.swift \
            ci/ProductRulesSmoke.swift \
            -framework SwiftData \
            -o /tmp/keepmeter-product-rules-smoke
          /tmp/keepmeter-product-rules-smoke

      - name: Exercise SwiftData persistence reopen
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            KeepMeter/Models/Purchase.swift \
            KeepMeter/Models/UsageEvent.swift \
            ci/PersistenceSmoke.swift \
            -framework SwiftData \
            -o /tmp/keepmeter-persistence-smoke
          /tmp/keepmeter-persistence-smoke

      - name: Build KeepMeter Debug for iOS Simulator
        run: |
          set -o pipefail
          rm -rf /tmp/keepmeter-debug-derived
          xcodebuild \
            -project KeepMeter.xcodeproj \
            -scheme KeepMeter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/keepmeter-debug-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Exercise booted iOS simulator runtime
        run: python3 ci/simulator-runtime-smoke.py /tmp/keepmeter-debug-derived/Build/Products/Debug-iphonesimulator/KeepMeter.app

      - name: Upload runtime screenshots
        uses: actions/upload-artifact@v4
        with:
          name: keepmeter-runtime-screenshots
          path: /tmp/keepmeter-runtime/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build KeepMeter Release for iOS Simulator
        run: |
          set -o pipefail
          rm -rf /tmp/keepmeter-release-derived
          xcodebuild \
            -project KeepMeter.xcodeproj \
            -scheme KeepMeter \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/keepmeter-release-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Debug runtime hooks are absent from Release binary
        run: |
          set -euo pipefail
          release_binary="/tmp/keepmeter-release-derived/Build/Products/Release-iphonesimulator/KeepMeter.app/KeepMeter"
          test -s "$release_binary"
          strings "$release_binary" > /tmp/keepmeter-release-strings.txt

          forbidden=(
            "keepMeterRuntimeSeed"
            "keepMeterRuntimeProbe"
            "keepmeter-runtime-persistence-ok.txt"
            "Studio Headphones"
            "Travel Backpack"
          )

          for marker in "${forbidden[@]}"; do
            if grep -F "$marker" /tmp/keepmeter-release-strings.txt >/dev/null; then
              echo "::error title=Release QA isolation::DEBUG-only runtime marker leaked into Release binary: $marker"
              exit 1
            fi
          done

          echo "✓ DEBUG-only runtime seed/probe hooks are absent from Release binary"

      - name: Validate privacy manifest in built app bundle
        run: |
          set -euo pipefail
          bundle_manifest="/tmp/keepmeter-release-derived/Build/Products/Release-iphonesimulator/KeepMeter.app/PrivacyInfo.xcprivacy"
          test -s "$bundle_manifest"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          source_path = Path("KeepMeter/PrivacyInfo.xcprivacy")
          bundle_path = Path("/tmp/keepmeter-release-derived/Build/Products/Release-iphonesimulator/KeepMeter.app/PrivacyInfo.xcprivacy")

          with source_path.open("rb") as handle:
              source = plistlib.load(handle)
          with bundle_path.open("rb") as handle:
              bundled = plistlib.load(handle)

          if source != bundled:
              raise SystemExit("Bundled PrivacyInfo.xcprivacy does not match the source manifest")

          print("✓ PrivacyInfo.xcprivacy is bundled in the Release app product")
          print("✓ Bundled privacy manifest matches the source manifest")
          PY
