name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate StoreKit test configuration
        run: |
          set -euo pipefail
          python3 -m json.tool KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '"productID" : "de.kamilunavo.keepmeter.pro.lifetime"' KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '../../../KeepMeter/StoreKit/KeepMeter.storekit' KeepMeter.xcodeproj/xcshareddata/xcschemes/KeepMeter.xcscheme >/dev/null

      - name: Validate App Store release settings
        run: bash ci/release-preflight.sh

      - name: Exercise SwiftData persistence reopen
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            KeepMeter/Models/Purchase.swift \
            KeepMeter/Models/UsageEvent.swift \
            ci/PersistenceSmoke.swift \
            -framework SwiftData \
            -o /tmp/keepmeter-persistence-smoke
          /tmp/keepmeter-persistence-smoke

      - name: Build KeepMeter Debug for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KeepMeter.xcodeproj \
            -scheme KeepMeter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build KeepMeter Release for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KeepMeter.xcodeproj \
            -scheme KeepMeter \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
