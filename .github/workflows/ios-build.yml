name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate StoreKit test configuration
        run: |
          set -euo pipefail
          python3 -m json.tool KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '"productID" : "de.kamilunavo.keepmeter.pro.lifetime"' KeepMeter/StoreKit/KeepMeter.storekit >/dev/null
          grep -F '../../../KeepMeter/StoreKit/KeepMeter.storekit' KeepMeter.xcodeproj/xcshareddata/xcschemes/KeepMeter.xcscheme >/dev/null

      - name: Build KeepMeter for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KeepMeter.xcodeproj \
            -scheme KeepMeter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
