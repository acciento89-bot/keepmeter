name: StoreKit Lifetime Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: keepmeter-storekit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storekit-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Exercise Lifetime Pro with StoreKitTest
        run: bash ci/storekit-test-smoke.sh
