name: Kamilunavo Trace ASC App Probe

on:
  push:
    branches:
      - agent/trace-testflight-relay
    paths:
      - '.github/workflows/trace-asc-app-probe.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: trace-asc-app-probe
  cancel-in-progress: true

env:
  BUNDLE_ID: de.kamilunavo.trace

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - name: Require App Store Connect credentials
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"

      - name: Build short-lived App Store Connect JWT
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          python3 - <<'PY'
          import os, time, jwt
          key_id = os.environ['ASC_KEY_ID']
          issuer = os.environ['ASC_ISSUER_ID']
          key_path = os.path.join(os.environ['RUNNER_TEMP'], f'AuthKey_{key_id}.p8')
          with open(key_path, 'r', encoding='utf-8') as f:
              private_key = f.read()
          now = int(time.time())
          token = jwt.encode(
              {'iss': issuer, 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'},
              private_key,
              algorithm='ES256',
              headers={'kid': key_id, 'typ': 'JWT'},
          )
          with open(os.environ['RUNNER_TEMP'] + '/asc-token.txt', 'w', encoding='utf-8') as f:
              f.write(token)
          PY

      - name: Query exact Trace app record
        id: app
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/asc-token.txt")"
          RESPONSE="$RUNNER_TEMP/trace-app.json"
          HTTP=$(curl -sS -o "$RESPONSE" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            --get \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            'https://api.appstoreconnect.apple.com/v1/apps')
          echo "App Store Connect HTTP=$HTTP"
          if [[ "$HTTP" != '200' ]]; then
            jq '{errors: [.errors[]? | {status, code, title, detail}]}' "$RESPONSE" || cat "$RESPONSE"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo "http=$HTTP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(jq '.data | length' "$RESPONSE")
          echo "Trace app records found=$COUNT"
          jq -r '.data[]? | "appId=\(.id) name=\(.attributes.name) bundleId=\(.attributes.bundleId) sku=\(.attributes.sku) primaryLocale=\(.attributes.primaryLocale)"' "$RESPONSE"
          if [[ "$COUNT" -eq 1 ]]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "app_id=$(jq -r '.data[0].id' "$RESPONSE")" >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
          echo 'http=200' >> "$GITHUB_OUTPUT"

      - name: Publish app-record probe status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.app.outputs.found }}
          HTTP_CODE: ${{ steps.app.outputs.http }}
        run: |
          set -euo pipefail
          if [[ "$FOUND" == 'true' ]]; then
            STATE='success'
            DESCRIPTION='Trace App Store Connect app record found'
          elif [[ "$HTTP_CODE" == '200' ]]; then
            STATE='error'
            DESCRIPTION='Trace App Store Connect app record not found'
          else
            STATE='failure'
            DESCRIPTION="Trace App Store Connect query failed (HTTP ${HTTP_CODE:-unknown})"
          fi
          PAYLOAD=$(jq -n --arg state "$STATE" --arg description "$DESCRIPTION" --arg context 'trace-relay/app-record' '{state:$state,description:$description,context:$context}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD" >/dev/null

      - name: Fail if Trace app record is absent
        if: steps.app.outputs.found != 'true'
        run: exit 1

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/asc-token.txt "$RUNNER_TEMP"/trace-app.json
