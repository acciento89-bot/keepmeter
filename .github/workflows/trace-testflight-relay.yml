name: Kamilunavo Trace TestFlight Relay

on:
  push:
    branches:
      - agent/trace-testflight-relay
    paths:
      - '.github/workflows/trace-testflight-relay.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: trace-testflight-relay
  cancel-in-progress: false

env:
  TRACE_REPO: acciento89-bot/appideenchatgpt
  TRACE_SHA: 69b8a1d99082ff804f2a532c636af3008d79546a
  TEAM_ID: TKG684N5GL
  BUNDLE_ID: de.kamilunavo.trace
  VERSION: 0.1.0
  BUILD: '1'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v5

      - name: Require relay credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          echo 'ASC relay credentials are present; values remain masked.'

      - name: Checkout exact merged Kamilunavo Trace source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: 69b8a1d99082ff804f2a532c636af3008d79546a
          path: trace-src

      - name: Verify exact release source and preflights
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trace-src rev-parse HEAD)" = "$TRACE_SHA"
          python3 trace-src/apps/002-evidaro/ci/preflight.py
          python3 trace-src/apps/002-evidaro/ci/release_preflight.py
          python3 trace-src/apps/002-evidaro/ci/public_identity_preflight.py

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Materialize App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive signed Kamilunavo Trace 0.1.0 (1)
        working-directory: trace-src/apps/002-evidaro/prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/KamilunavoTrace.xcarchive"
          xcodebuild \
            -project EvidaroPrototype.xcodeproj \
            -scheme EvidaroPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KamilunavoTrace.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Verify signed archive identity
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KamilunavoTrace.xcarchive/Products/Applications/EvidaroPrototype.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 'Kamilunavo Trace'
          echo "Signed archive verified: $BUNDLE_ID $VERSION ($BUILD)"

      - name: Create App Store Connect export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/TraceExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/TraceExportOptions.plist"

      - name: Upload exact Trace build to TestFlight
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          rm -rf "$RUNNER_TEMP/TraceTestFlightExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/KamilunavoTrace.xcarchive" \
            -exportPath "$RUNNER_TEMP/TraceTestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/TraceExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/trace-testflight-export.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload relay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamilunavo-trace-testflight-relay-diagnostics
          path: ${{ runner.temp }}/trace-testflight-export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish relay result status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_STATUS: ${{ steps.upload.outputs.status }}
        run: |
          set -euo pipefail
          if [[ "$UPLOAD_STATUS" == '0' ]]; then
            STATE='success'
            DESCRIPTION='Kamilunavo Trace 0.1.0 (1) uploaded to TestFlight'
          else
            STATE='failure'
            DESCRIPTION='Trace TestFlight relay failed; inspect Apple diagnostics'
          fi
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD=$(jq -n --arg state "$STATE" --arg target_url "$TARGET_URL" --arg description "$DESCRIPTION" --arg context 'trace-relay/testflight-upload' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD" >/dev/null

      - name: Fail relay if Apple upload failed
        if: steps.upload.outputs.status != '0'
        run: exit 1

      - name: Remove App Store Connect API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
