name: Android Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-store-screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build screenshot APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Capture real German app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p /tmp/keepmeter-store-screenshots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop de.kamilunavo.keepmeter
            adb shell am start -W -n de.kamilunavo.keepmeter/.MainActivity --ez de.kamilunavo.keepmeter.STORE_SCREENSHOTS true
            sleep 6
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/01-aktive-kaeufe.png
            adb shell input tap 300 850
            sleep 6
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/02-kosten-und-frist.png
            adb shell am force-stop de.kamilunavo.keepmeter
            adb shell am start -W -n de.kamilunavo.keepmeter/.MainActivity --ez de.kamilunavo.keepmeter.STORE_SCREENSHOTS true
            sleep 6
            adb shell input tap 405 2250
            sleep 6
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/03-auswertung.png
            file /tmp/keepmeter-store-screenshots/*.png
            sha256sum /tmp/keepmeter-store-screenshots/*.png | cut -d' ' -f1 | sort -u | awk 'END { exit NR == 3 ? 0 : 1 }'
      - name: Upload authentic Play Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: KeepMeter-Play-Store-Screenshots-de-DE
          path: /tmp/keepmeter-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
