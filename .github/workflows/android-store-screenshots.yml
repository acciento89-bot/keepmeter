name: Android Store Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-store-screenshots.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-store-screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build screenshot APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Capture real German app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p /tmp/keepmeter-store-screenshots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop de.kamilunavo.keepmeter
            adb shell am start -W -n de.kamilunavo.keepmeter/.MainActivity --ez de.kamilunavo.keepmeter.STORE_SCREENSHOTS true
            sleep 6
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/01-aktive-kaeufe.png
            adb shell input tap 405 2250
            sleep 4
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/02-auswertung.png
            adb shell input tap 945 2250
            sleep 4
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/03-einstellungen.png
            file /tmp/keepmeter-store-screenshots/*.png
            test "$(sha256sum /tmp/keepmeter-store-screenshots/*.png | cut -d' ' -f1 | sort -u | wc -l | tr -d ' ')" -eq 3
      - name: Upload authentic Play Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: KeepMeter-Play-Store-Screenshots-de-DE
          path: /tmp/keepmeter-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Persist authentic screenshots in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          target='store/google-play/screenshots/de-DE'
          mkdir -p "$target"
          rm -f "$target"/*.png
          cp /tmp/keepmeter-store-screenshots/*.png "$target"/
          cat > store/google-play/screenshots/README.md <<'EOF'
          # Google Play screenshots

          These screenshots are captured from the real Android app in deterministic store-screenshot mode. Do not replace them with mockups, concept art, or reconstructed UI. Google Play rejected the previous listing because it showed features/UI that did not match version code 2.
          EOF
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add store/google-play/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'Store authentic Android screenshots for Google Play'
            git push origin HEAD:main
          fi
