name: Android Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-store-screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build screenshot APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Capture real German app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p /tmp/keepmeter-store-screenshots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb root
            adb shell setprop persist.sys.locale de-DE
            adb shell setprop persist.sys.language de
            adb shell setprop persist.sys.country DE
            adb shell stop
            adb shell start
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell settings put global hide_error_dialogs 1
            size="$(adb shell wm size | sed -n 's/.*: \([0-9]*\)x\([0-9]*\).*/\1 \2/p' | tail -1)"
            set -- $size
            width="$1"
            height="$2"
            tap() { adb shell input tap "$((width * $1 / 100))" "$((height * $2 / 100))"; }
            dismiss_system_dialog() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/window.xml 2>/dev/null | grep -Eq "isn't responding|reagiert nicht"; then
                tap 30 57
                sleep 2
              fi
            }
            adb shell am force-stop de.kamilunavo.keepmeter
            adb shell am start -W -n de.kamilunavo.keepmeter/.MainActivity --ez de.kamilunavo.keepmeter.STORE_SCREENSHOTS true
            sleep 6
            dismiss_system_dialog
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/01-aktive-kaeufe.png
            tap 50 32
            sleep 2
            dismiss_system_dialog
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/02-kosten-und-frist.png
            adb shell input keyevent 4
            sleep 1
            tap 38 91
            sleep 2
            dismiss_system_dialog
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/03-auswertung.png
            tap 13 91
            sleep 1
            tap 90 7
            sleep 2
            dismiss_system_dialog
            adb exec-out screencap -p > /tmp/keepmeter-store-screenshots/04-kauf-hinzufuegen.png
            file /tmp/keepmeter-store-screenshots/*.png
      - name: Upload authentic Play Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: KeepMeter-Play-Store-Screenshots-de-DE
          path: /tmp/keepmeter-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
